{% extends "base.html" %}{% block contenido %}<section class="panel estrecho"><h1>Registro de paciente</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/registro"><label>Nombre completo</label><input name="nombre" required maxlength="120">
<label>Fecha de nacimiento</label><input type="date" name="fecha_nacimiento" required>
<label>Correo</label><input type="email" name="correo" required maxlength="120">
<label>Teléfono</label><input name="telefono" maxlength="15">
<label>Contraseña</label><input type="password" name="contrasena" required minlength="8">
<button>Crear cuenta</button></form><p><a href="/login">Volver al inicio de sesión</a></p></section>{% endblock %}
